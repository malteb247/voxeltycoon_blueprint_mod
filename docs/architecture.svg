<svg xmlns="http://www.w3.org/2000/svg" width="920" height="760" viewBox="0 0 920 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4a5c"/>
    </marker>
    <style>
      .band { fill: #f3f5f9; stroke: #dde2ea; }
      .band.alt { fill: #eaeef5; }
      .layer { font-size: 13px; font-weight: 700; fill: #5a6678; }
      .layer-sub { font-size: 11px; fill: #7b8696; }
      .box { fill: #ffffff; stroke: #3d4a5c; stroke-width: 1.6; }
      .box.entry { fill: #ffe9b8; }
      .box.ui { fill: #d6e6ff; }
      .box.case { fill: #d5f0dc; }
      .box.help { fill: #efe0fa; }
      .box.data { fill: #fde0d6; }
      .box.game { fill: #e4e6ea; stroke-dasharray: 6 4; }
      .name { font-size: 14px; font-weight: 700; fill: #1f2733; text-anchor: middle; }
      .desc { font-size: 11px; fill: #44505f; text-anchor: middle; }
      .edge { stroke: #3d4a5c; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .edge-label { font-size: 11px; fill: #44505f; text-anchor: middle; }
      .title { font-size: 16px; font-weight: 700; fill: #1f2733; }
    </style>
  </defs>
  <rect width="920" height="760" fill="#ffffff"/>

  <text x="20" y="24" class="title">Layers (an arrow means "uses")</text>

  <!-- bands -->
  <rect class="band" x="10" y="36" width="900" height="70" rx="8"/>
  <rect class="band alt" x="10" y="114" width="900" height="70" rx="8"/>
  <rect class="band" x="10" y="192" width="900" height="92" rx="8"/>
  <rect class="band alt" x="10" y="292" width="900" height="92" rx="8"/>
  <rect class="band" x="10" y="392" width="900" height="92" rx="8"/>
  <rect class="band alt" x="10" y="492" width="900" height="62" rx="8"/>

  <text x="24" y="66" class="layer">Entry</text>
  <text x="24" y="144" class="layer">Input / UI</text>
  <text x="24" y="228" class="layer">Use cases</text>
  <text x="24" y="328" class="layer">Helpers</text>
  <text x="24" y="428" class="layer">Data</text>
  <text x="24" y="444" class="layer-sub">used by all layers above</text>
  <text x="24" y="520" class="layer">Game API</text>

  <!-- entry -->
  <rect class="box entry" x="410" y="44" width="220" height="54" rx="6"/>
  <text x="520" y="68" class="name">BlueprintMod</text>
  <text x="520" y="85" class="desc">adds the toolbar button</text>

  <!-- ui -->
  <rect class="box ui" x="410" y="122" width="220" height="54" rx="6"/>
  <text x="520" y="146" class="name">BlueprintTool</text>
  <text x="520" y="163" class="desc">modes, hotkeys, messages</text>

  <!-- use cases -->
  <rect class="box case" x="250" y="207" width="220" height="62" rx="6"/>
  <text x="360" y="232" class="name">Capture</text>
  <text x="360" y="250" class="desc">world → Blueprint</text>

  <rect class="box case" x="570" y="207" width="220" height="62" rx="6"/>
  <text x="680" y="232" class="name">Placement</text>
  <text x="680" y="250" class="desc">ghost preview, price, build</text>

  <!-- helpers -->
  <rect class="box help" x="400" y="307" width="220" height="62" rx="6"/>
  <text x="510" y="332" class="name">PlacementTransform</text>
  <text x="510" y="350" class="desc">rotation and offset</text>

  <rect class="box help" x="660" y="307" width="220" height="62" rx="6"/>
  <text x="770" y="332" class="name">TerrainPlanner</text>
  <text x="770" y="350" class="desc">dig / fill plan (TerrainPlan)</text>

  <!-- data -->
  <rect class="box data" x="250" y="407" width="250" height="62" rx="6"/>
  <text x="375" y="432" class="name">Models/ (Blueprint, …)</text>
  <text x="375" y="450" class="desc">rails, parts, signals, terrain</text>

  <rect class="box data" x="610" y="407" width="250" height="62" rx="6"/>
  <text x="735" y="432" class="name">Storage</text>
  <text x="735" y="450" class="desc">reads / writes *.vtbp files</text>

  <!-- game -->
  <rect class="box game" x="250" y="504" width="610" height="40" rx="6"/>
  <text x="555" y="529" class="name">VoxelTycoon.dll · UnityEngine</text>

  <!-- edges -->
  <path class="edge" d="M520,98 L520,122"/>
  <path class="edge" d="M470,176 L360,207"/>
  <path class="edge" d="M570,176 L680,207"/>
  <path class="edge" d="M630,149 L895,149 L895,438 L860,438"/>
  <text x="780" y="143" class="edge-label">load / save / delete</text>
  <path class="edge" d="M320,269 L320,407"/>
  <path class="edge" d="M640,269 L560,307"/>
  <path class="edge" d="M740,269 L770,307"/>
  <path class="edge" d="M660,338 L620,338"/>
  <path class="edge" d="M610,438 L500,438"/>

  <!-- data flow -->
  <text x="20" y="600" class="title">Data flow</text>
  <g>
    <rect class="box" x="10"  y="640" width="130" height="56" rx="6" fill="#ffffff"/>
    <text x="75"  y="664" class="name">World</text>
    <text x="75"  y="682" class="desc">rails, bridges, terrain</text>

    <rect class="box data" x="215" y="640" width="130" height="56" rx="6"/>
    <text x="280" y="664" class="name">Blueprint</text>
    <text x="280" y="682" class="desc">in memory</text>

    <rect class="box data" x="420" y="640" width="130" height="56" rx="6"/>
    <text x="485" y="664" class="name">*.vtbp file</text>
    <text x="485" y="682" class="desc">share it with others</text>

    <rect class="box data" x="625" y="640" width="130" height="56" rx="6"/>
    <text x="690" y="664" class="name">Blueprint</text>
    <text x="690" y="682" class="desc">loaded again</text>

    <rect class="box" x="780" y="640" width="130" height="56" rx="6" fill="#ffffff"/>
    <text x="845" y="664" class="name">World</text>
    <text x="845" y="682" class="desc">built copy</text>
  </g>
  <path class="edge" d="M140,668 L215,668"/>
  <text x="177" y="632" class="edge-label">Capture</text>
  <path class="edge" d="M345,668 L420,668"/>
  <text x="382" y="632" class="edge-label">Storage</text>
  <path class="edge" d="M550,668 L625,668"/>
  <text x="587" y="632" class="edge-label">Storage</text>
  <path class="edge" d="M755,668 L780,668"/>
  <text x="767" y="632" class="edge-label">Placement</text>
  <text x="460" y="730" class="desc">Placement uses PlacementTransform and TerrainPlanner on the way (preview → price → build).</text>
</svg>
